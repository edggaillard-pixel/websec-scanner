[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "websec-scanner"
version = "0.1.0"
description = "Non-destructive web security posture scanner (HTTP/TLS headers, information exposure, risk reporting)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Edgar Gaillard" }]
keywords = ["security", "scanner", "http-headers", "tls", "owasp", "audit", "cybersecurity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36"]
dev = ["pytest>=8.0", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
websec-scan = "websec_scanner.cli:app"

[project.urls]
Homepage = "https://github.com/edggaillard-pixel/websec-scanner"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
websec_scanner = ["data/*.txt", "reporting/templates/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's API intentionally uses function calls (Option/Argument) as defaults.
"src/websec_scanner/cli.py" = ["B008"]
# Tests favour readability over strict line length.
"tests/*" = ["E501"]
